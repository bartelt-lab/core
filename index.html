<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="CORE Initiative" />

    <!--
      Title, description, canonical and Open Graph tags are intentionally NOT
      here. src/components/common/SeoHead.jsx renders them per route (React 19
      hoists document metadata into <head>), and scripts/prerender.mjs bakes the
      result into the static HTML for each route. Adding static copies here
      would leave two of each tag in the document, and crawlers read the first.
    -->

    <!--
      Legacy HashRouter links. Every URL this site published before the move to
      real paths looked like /#/tuc/teaching, and those live on in bookmarks,
      emails and papers. Translate them before anything renders, otherwise the
      server serves "/" and the visitor silently lands on the homepage.
      In-page anchors (#team) do not start with "#/" and are left alone.
    -->
    <script>
      (function () {
        function rewriteLegacyHash() {
          var target = window.location.hash.slice(1);
          var second = target.charAt(1);
          // Only a single-slash absolute path is safe to hand to replace().
          // "//host" and "/\host" are read as protocol-relative URLs by the
          // browser, which would make this an open redirect off the site.
          if (target.charAt(0) === "/" && second !== "/" && second !== "\\") {
            window.location.replace(target);
          }
        }
        rewriteLegacyHash();
        // Also covers pasting an old link while already on the site, which is a
        // same-document change and would not re-run this script.
        window.addEventListener("hashchange", rewriteLegacyHash);
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
