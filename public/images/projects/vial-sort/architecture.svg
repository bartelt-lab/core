<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="64" y="86" font-size="34" font-weight="700" fill="#020617">Five endpoints are the whole interface</text>
  <text x="64" y="126" font-size="21" fill="#64748b">Every client reaches the arm the same way &#8212; the browser panel and the evaluation harness are both just callers of this server.</text>

  <!-- on-robot boundary: everything inside runs on the Jetson beside the arm -->
  <rect x="520" y="180" width="880" height="660" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="544" y="214" font-size="15" font-weight="700" letter-spacing="2" fill="#94a3b8">ON ROBOT &#183; JETSON THOR</text>

  <!-- workstation, off the robot -->
  <text x="64" y="214" font-size="15" font-weight="700" letter-spacing="2" fill="#94a3b8">OFF ROBOT</text>
  <rect x="64" y="250" width="340" height="170" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="234" y="300" font-size="24" font-weight="700" text-anchor="middle" fill="#1e40af">Control panel</text>
  <text x="234" y="328" font-size="16" text-anchor="middle" fill="#3b82f6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cv_run.py</text>
  <text x="234" y="358" font-size="15" text-anchor="middle" fill="#60a5fa">live feeds &#183; path overlay</text>
  <text x="234" y="380" font-size="15" text-anchor="middle" fill="#60a5fa">CV slot-reader &#183; Home / Execute</text>

  <!-- inference server, and the five endpoints that are the whole interface -->
  <rect x="580" y="236" width="800" height="190" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="980" y="278" font-size="26" font-weight="700" text-anchor="middle" fill="#065f46">VLA inference server</text>
  <text x="980" y="304" font-size="17" text-anchor="middle" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">vla_server.py</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="604" y="330" width="140" height="72" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <text x="674" y="359" font-size="17" font-weight="700" text-anchor="middle" fill="#065f46">/execute</text>
    <text x="674" y="382" font-size="13.5" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif">run a command</text>

    <rect x="757" y="330" width="140" height="72" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <text x="827" y="359" font-size="17" font-weight="700" text-anchor="middle" fill="#065f46">/home</text>
    <text x="827" y="382" font-size="13.5" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif">back to start pose</text>

    <rect x="910" y="330" width="140" height="72" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <text x="980" y="359" font-size="17" font-weight="700" text-anchor="middle" fill="#065f46">/observe</text>
    <text x="980" y="382" font-size="13.5" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif">stream frames</text>

    <rect x="1063" y="330" width="140" height="72" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <text x="1133" y="359" font-size="17" font-weight="700" text-anchor="middle" fill="#065f46">/state</text>
    <text x="1133" y="382" font-size="13.5" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif">arm status</text>

    <rect x="1216" y="330" width="140" height="72" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <text x="1286" y="359" font-size="17" font-weight="700" text-anchor="middle" fill="#065f46">/stop</text>
    <text x="1286" y="382" font-size="13.5" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif">halt motion</text>
  </g>

  <!-- policy, cameras, arm -->
  <rect x="580" y="486" width="380" height="124" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="770" y="534" font-size="24" font-weight="700" text-anchor="middle" fill="#92400e">&#960;0.5 policy</text>
  <text x="770" y="564" font-size="16" text-anchor="middle" fill="#b45309">action expert only</text>
  <text x="770" y="588" font-size="16" text-anchor="middle" fill="#d97706">50-step action chunks</text>

  <rect x="1000" y="486" width="380" height="124" rx="16" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="1190" y="534" font-size="24" font-weight="700" text-anchor="middle" fill="#991b1b">Cameras</text>
  <text x="1190" y="564" font-size="16" text-anchor="middle" fill="#dc2626">top / wrist / side</text>
  <text x="1190" y="588" font-size="16" text-anchor="middle" fill="#f87171">RGB only</text>

  <rect x="790" y="676" width="380" height="124" rx="16" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
  <text x="980" y="730" font-size="24" font-weight="700" text-anchor="middle" fill="#6b21a8">SO-101 arm</text>
  <text x="980" y="762" font-size="16" text-anchor="middle" fill="#9333ea">6-DOF</text>

  <!-- Edges. The two horizontal lanes cross the dashed boundary: that crossing is the
       HTTP hop between the workstation and the robot. Arrowheads are drawn as explicit
       triangles rather than <marker>, which not every SVG rasterizer honours. -->
  <g stroke="#cbd5e1" stroke-width="3" fill="none">
    <path d="M404 300 H 564"/>
    <path d="M574 372 H 428"/>
    <path d="M700 430 V 468"/>
    <path d="M840 480 V 432"/>
    <path d="M1190 480 V 432"/>
    <path d="M980 430 V 658"/>
  </g>
  <g fill="#cbd5e1">
    <path d="M562 292 l 16 8 l -16 8 z"/>
    <path d="M426 364 l -16 8 l 16 8 z"/>
    <path d="M692 466 l 8 16 l 8 -16 z"/>
    <path d="M832 446 l 8 -16 l 8 16 z"/>
    <path d="M1182 446 l 8 -16 l 8 16 z"/>
    <path d="M972 656 l 8 16 l 8 -16 z"/>
  </g>

  <g font-size="15" fill="#94a3b8">
    <text x="491" y="284" text-anchor="middle">position command</text>
    <text x="501" y="356" text-anchor="middle">live feeds</text>
    <text x="712" y="462">observation</text>
    <text x="852" y="462">action chunk</text>
    <text x="1202" y="462">RGB frames</text>
    <text x="992" y="650">joint targets &#183; 30 Hz</text>
  </g>

  <text x="64" y="876" font-size="15" fill="#94a3b8">Everything inside the dashed boundary runs on the Jetson beside the arm; only the control panel is off-robot.</text>
</svg>
