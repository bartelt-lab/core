<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="64" y="86" font-size="34" font-weight="700" fill="#020617">Only the action expert learns</text>
  <text x="64" y="126" font-size="21" fill="#64748b">At 150 demonstrations, updating billions of vision parameters erodes the grounding that makes the model follow instructions.</text>

  <!-- inputs -->
  <text x="64" y="196" font-size="15" font-weight="700" letter-spacing="2" fill="#94a3b8">OBSERVATION</text>
  <g>
    <rect x="64" y="216" width="196" height="64" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="162" y="255" font-size="18" text-anchor="middle" fill="#1e40af">3 RGB views</text>
    <rect x="64" y="292" width="196" height="64" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="162" y="331" font-size="18" text-anchor="middle" fill="#1e40af">7-D state</text>
    <rect x="64" y="368" width="196" height="64" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="162" y="400" font-size="18" text-anchor="middle" fill="#1e40af">language</text>
    <text x="162" y="421" font-size="15" text-anchor="middle" fill="#60a5fa">instruction</text>
  </g>

  <!-- arrows -->
  <g stroke="#cbd5e1" stroke-width="3" fill="none">
    <path d="M268 248 L 316 248 L 316 324 L 360 324"/>
    <path d="M268 324 L 360 324"/>
    <path d="M268 400 L 316 400 L 316 324 L 360 324"/>
  </g>
  <path d="M356 316 l 16 8 l -16 8 z" fill="#cbd5e1"/>

  <!-- frozen block -->
  <rect x="372" y="200" width="452" height="252" rx="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 7"/>
  <g>
    <rect x="396" y="222" width="30" height="24" rx="5" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M403 222 v -9 a 8 8 0 0 1 16 0 v 9" fill="none" stroke="#64748b" stroke-width="3"/>
  </g>
  <text x="440" y="243" font-size="17" font-weight="700" letter-spacing="2" fill="#64748b">FROZEN</text>
  <text x="800" y="243" font-size="17" text-anchor="end" fill="#94a3b8">no gradients &#183; forward pass only</text>

  <rect x="396" y="266" width="404" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="418" y="300" font-size="21" font-weight="700" fill="#475569">SigLIP image encoder</text>
  <text x="418" y="324" font-size="16" fill="#94a3b8">web-pretrained visual features</text>

  <rect x="396" y="352" width="404" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="418" y="386" font-size="21" font-weight="700" fill="#475569">Gemma language model</text>
  <text x="418" y="410" font-size="16" fill="#94a3b8">PaliGemma recipe &#183; parses the position grammar</text>

  <!-- arrow to expert -->
  <path d="M832 324 L 900 324" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  <path d="M896 316 l 16 8 l -16 8 z" fill="#cbd5e1"/>
  <text x="866" y="308" font-size="14" text-anchor="middle" fill="#94a3b8">tokens</text>

  <!-- trainable block -->
  <rect x="912" y="200" width="330" height="252" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <circle cx="944" cy="234" r="9" fill="#10b981"/>
  <text x="964" y="241" font-size="17" font-weight="700" letter-spacing="2" fill="#047857">TRAINABLE</text>
  <rect x="936" y="266" width="282" height="156" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
  <text x="958" y="306" font-size="23" font-weight="700" fill="#065f46">Action expert</text>
  <text x="958" y="338" font-size="17" fill="#059669">flow-matching head</text>
  <text x="958" y="378" font-size="16" fill="#64748b">regresses a velocity field</text>
  <text x="958" y="402" font-size="16" fill="#64748b">from noise to a clean chunk</text>

  <!-- output -->
  <path d="M1250 324 L 1310 324" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  <path d="M1306 316 l 16 8 l -16 8 z" fill="#cbd5e1"/>
  <rect x="1322" y="264" width="214" height="120" rx="14" fill="#0f172a"/>
  <text x="1429" y="308" font-size="40" font-weight="700" text-anchor="middle" fill="#ffffff">50</text>
  <text x="1429" y="338" font-size="17" text-anchor="middle" fill="#94a3b8">future timesteps</text>
  <text x="1429" y="362" font-size="15" text-anchor="middle" fill="#64748b">one forward pass</text>

  <!-- consequence band -->
  <rect x="64" y="512" width="1472" height="92" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="96" y="552" font-size="20" font-weight="700" fill="#065f46">The frozen majority never stores gradients, optimiser state or activations &#8212;</text>
  <text x="96" y="584" font-size="18" fill="#047857">so a 3B-parameter fine-tune fits in about 19 GB, far below a full one. An unfrozen variant overfit and failed to grasp.</text>

  <!-- config strip -->
  <text x="64" y="666" font-size="15" font-weight="700" letter-spacing="2" fill="#94a3b8">TRAINING CONFIGURATION</text>
  <g>
    <rect x="64" y="686" width="228" height="96" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="88" y="722" font-size="15" fill="#94a3b8">Base model</text>
    <text x="88" y="756" font-size="19" font-weight="700" fill="#1e293b">pi05_base</text>

    <rect x="308" y="686" width="228" height="96" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="332" y="722" font-size="15" fill="#94a3b8">Objective</text>
    <text x="332" y="756" font-size="19" font-weight="700" fill="#1e293b">flow matching</text>

    <rect x="552" y="686" width="228" height="96" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="576" y="722" font-size="15" fill="#94a3b8">Steps / batch</text>
    <text x="576" y="756" font-size="19" font-weight="700" fill="#1e293b">30,000 / 16</text>

    <rect x="796" y="686" width="228" height="96" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="820" y="722" font-size="15" fill="#94a3b8">Precision</text>
    <text x="820" y="756" font-size="19" font-weight="700" fill="#1e293b">bfloat16</text>

    <rect x="1040" y="686" width="228" height="96" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1064" y="722" font-size="15" fill="#94a3b8">Optimiser</text>
    <text x="1064" y="756" font-size="19" font-weight="700" fill="#1e293b">AdamW</text>

    <rect x="1284" y="686" width="252" height="96" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1308" y="722" font-size="15" fill="#94a3b8">GPU</text>
    <text x="1308" y="756" font-size="19" font-weight="700" fill="#1e293b">1&#215; RTX PRO 6000</text>
  </g>
  <text x="64" y="832" font-size="17" fill="#94a3b8">Learning rate 1&#215;10&#8315;&#8308; peak, cosine decay to 2.5&#215;10&#8315;&#8310; &#183; 1,000-step warmup &#183; image augmentation on &#183; action and state 7-D, padded to 32</text>
</svg>
