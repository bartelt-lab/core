<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, system-ui, sans-serif">
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="64" y="86" font-size="34" font-weight="700" fill="#020617">The operating point sits between under-trained and over-fit</text>
  <text x="64" y="126" font-size="21" fill="#64748b">Checkpoints every 2,000 steps. Language grounding arrives first; the grasp is what gets lost again.</text>

  <!-- axis -->
  <line x1="64" y1="206" x2="1536" y2="206" stroke="#e2e8f0" stroke-width="3"/>
  <text x="64" y="188" font-size="15" font-weight="700" letter-spacing="2" fill="#94a3b8">TRAINING STEPS</text>
  <text x="1536" y="188" font-size="15" text-anchor="end" fill="#cbd5e1">30,000 total</text>

  <!-- 8k -->
  <g>
    <circle cx="274" cy="206" r="10" fill="#cbd5e1"/>
    <rect x="64" y="256" width="420" height="330" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="96" y="312" font-size="40" font-weight="700" fill="#94a3b8">8k</text>
    <text x="452" y="312" font-size="17" text-anchor="end" fill="#cbd5e1">&#8776; 1.2 epochs</text>
    <text x="96" y="352" font-size="20" font-weight="700" fill="#64748b">Under-trained</text>

    <text x="96" y="412" font-size="19" fill="#c0453a">&#10007;</text><text x="128" y="412" font-size="19" fill="#475569">Follows the command</text>
    <text x="96" y="458" font-size="19" fill="#cbd5e1">&#8212;</text><text x="128" y="458" font-size="19" fill="#cbd5e1">Grasps</text>
    <text x="96" y="504" font-size="19" fill="#cbd5e1">&#8212;</text><text x="128" y="504" font-size="19" fill="#cbd5e1">Completes placement</text>

    <text x="96" y="558" font-size="17" fill="#94a3b8">Language grounding not yet learned.</text>
  </g>

  <!-- 12k -->
  <g>
    <circle cx="590" cy="206" r="14" fill="#10b981"/>
    <rect x="590" y="206" width="0" height="0"/>
    <rect x="516" y="256" width="420" height="330" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
    <text x="548" y="312" font-size="40" font-weight="700" fill="#047857">12k</text>
    <text x="904" y="312" font-size="17" text-anchor="end" fill="#34d399">&#8776; 1.8 epochs</text>
    <text x="548" y="352" font-size="20" font-weight="700" fill="#047857">Deployed</text>

    <text x="548" y="412" font-size="19" fill="#059669">&#10003;</text><text x="580" y="412" font-size="19" font-weight="700" fill="#065f46">Follows the command</text>
    <text x="548" y="458" font-size="19" fill="#059669">&#10003;</text><text x="580" y="458" font-size="19" font-weight="700" fill="#065f46">Grasps</text>
    <text x="548" y="504" font-size="19" fill="#059669">&#10003;</text><text x="580" y="504" font-size="19" font-weight="700" fill="#065f46">Completes placement</text>

    <text x="548" y="558" font-size="17" fill="#047857">Every result on this page comes from here.</text>
  </g>

  <!-- 16k -->
  <g>
    <circle cx="1120" cy="206" r="10" fill="#cbd5e1"/>
    <rect x="968" y="256" width="420" height="330" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1000" y="312" font-size="40" font-weight="700" fill="#94a3b8">16k</text>
    <text x="1356" y="312" font-size="17" text-anchor="end" fill="#cbd5e1">&#8776; 2.5 epochs</text>
    <text x="1000" y="352" font-size="20" font-weight="700" fill="#64748b">Over-fit</text>

    <text x="1000" y="412" font-size="19" fill="#059669">&#10003;</text><text x="1032" y="412" font-size="19" fill="#475569">Follows the command</text>
    <text x="1000" y="458" font-size="19" fill="#c0453a">&#10007;</text><text x="1032" y="458" font-size="19" fill="#475569">Grasps</text>
    <text x="1000" y="504" font-size="19" fill="#c0453a">&#10007;</text><text x="1032" y="504" font-size="19" fill="#475569">Completes placement</text>

    <text x="1000" y="558" font-size="17" fill="#94a3b8">Still understands the words, loses the hands.</text>
  </g>

  <!-- footnote band -->
  <rect x="64" y="640" width="1472" height="112" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="96" y="688" font-size="20" font-weight="700" fill="#1e293b">The window is narrow because the dataset is small.</text>
  <text x="96" y="724" font-size="18" fill="#64748b">104,421 frames across 150 demonstrations, so 12,000 steps at batch 16 is under two passes over the data.</text>

  <text x="64" y="812" font-size="17" fill="#94a3b8">Epochs = steps &#215; batch &#247; 104,421 frames.</text>
</svg>
