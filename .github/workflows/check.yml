name: Check pull request

# Runs the same lint and build as a deploy, on every pull request, so a change
# that would break the site shows a red cross before it is merged. Without
# this the first sign was a failed deploy on `main`.
#
# Nothing is published from here and the job gets a read-only token, so it is
# safe to run on pull requests from forks.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request makes the run for the old one pointless.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, as in deploy.yml: scripts/seo-files.mjs reads each
          # page's last change from `git log`.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The build's last step renders every page in headless Chromium.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Video gate, compile, SEO files, prerender: exactly what deploy.yml runs.
      - name: Build
        run: npm run build
