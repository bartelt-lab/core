<svg xmlns="http://www.w3.org/2000/svg" width="940" height="530" viewBox="0 0 940 530" role="img" aria-labelledby="t d">
<title id="t">Slide layout anatomy</title><desc id="d">A 16:9 slide with a 6 percent safe margin, a title zone, a body zone, and the logo in the bottom right corner, annotated with type sizes.</desc>
<rect width="940" height="530" fill="#ffffff"/>
<text x="30" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a"  >Slide — 16:9, 13.333 × 7.5 in (33.87 × 19.05 cm)</text><text x="30" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b"  >the margin is not decoration: projectors and video calls crop the edges</text><rect x="30" y="74" width="640" height="360" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/><rect x="70" y="114" width="560" height="280" fill="none" stroke="#09781b" stroke-dasharray="5 4"/><rect x="70" y="114" width="560" height="64" fill="#f1f5f9"/><text x="84" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="600" >Title — Poppins 600, 32–40 pt</text><text x="84" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >one line; if it wraps to three, it is a paragraph</text><rect x="70" y="192" width="560" height="150" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="84" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="600" >Body — Inter 400, 24 pt floor, 18 pt absolute</text><text x="84" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >the back row is ~8 m from the screen</text><rect x="534" y="368" width="96" height="26" fill="none" stroke="#01bc2b" stroke-width="1.5"/><text x="540" y="385" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#09781b"  >lockup ≥ 64 px</text><text x="84" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >one idea per slide</text><text x="350" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#09781b"  text-anchor="middle">6% margin — safe area</text><text x="696" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="700" >Carry over from the web</text><text x="696" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >Poppins headings, Inter body</text><text x="696" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >embed both, or a stranger’s laptop picks Calibri</text><text x="696" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >green marks CORE</text><text x="696" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >site accent marks the host institution</text><text x="696" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >flat brand colour</text><text x="696" y="221" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >the one gradient is the wordmark, nothing else</text><text x="696" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >never green text on white</text><text x="696" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >#01bc2b is 2.6:1 — worse on a projector</text><text x="696" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >slate for body text</text><text x="696" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >not black, not pure grey</text>
</svg>
