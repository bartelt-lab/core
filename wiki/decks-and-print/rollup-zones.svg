<svg xmlns="http://www.w3.org/2000/svg" width="666.5" height="776" viewBox="0 0 666.5 776" role="img" aria-labelledby="t d">
<title id="t">Roll-up banner layout zones</title><desc id="d">An 850 by 2000 mm roll-up banner divided into zones: a top curl and a bottom cassette that are both unusable, a logo zone, a headline zone, an eye-level band between 1000 and 1550 mm, and a detail zone.</desc>
<rect width="666.5" height="776" fill="#ffffff"/>
<text x="30" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a"  >Roll-up banner — 850 × 2000 mm</text><text x="30" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b"  >only the middle metre is read standing up</text><rect x="96" y="72" width="280.5" height="33" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="125.8" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >top curl</text><text x="86" y="85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b"  text-anchor="end">0</text><rect x="96" y="105" width="280.5" height="99" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="125.8" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >logo zone</text><text x="125.8" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >lockup here, never lower</text><text x="86" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b"  text-anchor="end">100</text><rect x="96" y="204" width="280.5" height="198" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="125.8" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >headline</text><text x="125.8" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >above eye level, read first</text><text x="86" y="217" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b"  text-anchor="end">400</text><rect x="96" y="402" width="280.5" height="181.5" fill="#ecfdf5" stroke="#01bc2b" stroke-width="1"/><text x="125.8" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >eye-level band</text><text x="125.8" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >the only zone read at a glance</text><text x="86" y="415" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b"  text-anchor="end">1000</text><rect x="96" y="583.5" width="280.5" height="82.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="125.8" y="603.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >detail / QR</text><text x="125.8" y="618.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >read up close, if at all</text><text x="86" y="596.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b"  text-anchor="end">1550</text><rect x="96" y="666" width="280.5" height="66" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="125.8" y="686" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >cassette</text><text x="125.8" y="701" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >hidden by the stand</text><text x="86" y="679" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b"  text-anchor="end">1800</text><text x="86" y="745" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b"  text-anchor="end">2000</text><text x="86" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#64748b"  text-anchor="end">mm</text><line x1="115.8" y1="72" x2="115.8" y2="732" stroke="#09781b" stroke-dasharray="4 3" stroke-width="1"/><line x1="356.7" y1="72" x2="356.7" y2="732" stroke="#09781b" stroke-dasharray="4 3" stroke-width="1"/><text x="404.5" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="700" >Fixed rules</text><text x="404.5" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >60 mm side margin</text><text x="404.5" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >dashed — the print wraps at the edges</text><text x="404.5" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >bottom 200 mm is lost</text><text x="404.5" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >the cassette covers it</text><text x="404.5" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >cap height ≥ 15 mm</text><text x="404.5" y="221" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >read at 3 m — roughly 42 pt and up</text><text x="404.5" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >headline ≥ 40 mm cap</text><text x="404.5" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >read from across a room</text><text x="404.5" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >no body copy below 24 pt</text><text x="404.5" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >nobody crouches to read a banner</text><text x="404.5" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="600" >300 dpi at final size</text><text x="404.5" y="353" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b"  >or vector; a web export looks soft</text>
</svg>
