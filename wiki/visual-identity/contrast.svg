<title id="t">Contrast of each primary step against white</title><desc id="d">A bar per step of the primary ramp showing its contrast ratio on white, with the 4.5 to 1 AA floor drawn as a dashed line. Step 600 sits just above the floor and step 500, the logo colour, sits well below it.</desc>
