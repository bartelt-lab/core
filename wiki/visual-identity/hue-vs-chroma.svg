<svg xmlns="http://www.w3.org/2000/svg" width="942" height="296" viewBox="0 0 942 296" role="img" aria-labelledby="t d">
<title id="t">Hue-only rotation versus propagating the anchor chroma</title><desc id="d">Two versions of the primary ramp from step 50 to 500. The shipped row keeps each step original chroma and looks soft. The rejected row applies the logo chroma at every step and turns the light tints into saturated neon greens.</desc>
<rect width="942" height="296" fill="#ffffff"/>
<text x="22" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">Why the ramp rotates in hue only</text><text x="22" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">the light steps are meant to look desaturated next to the mark — that is not a bug to fix</text><text x="22" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">hue only</text><text x="22" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#15803d">shipped</text><rect x="176" y="76" width="118" height="60" rx="5" fill="#EFFCEE"/><rect x="176" y="76" width="118" height="60" rx="5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="235" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">#EFFCEE</text><text x="235" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">50</text><rect x="300" y="76" width="118" height="60" rx="5" fill="#D6F7D5"/><rect x="300" y="76" width="118" height="60" rx="5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="359" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">#D6F7D5</text><text x="359" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">100</text><rect x="424" y="76" width="118" height="60" rx="5" fill="#AFEDAF"/><rect x="424" y="76" width="118" height="60" rx="5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="483" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">#AFEDAF</text><text x="483" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">200</text><rect x="548" y="76" width="118" height="60" rx="5" fill="#7FE081"/><rect x="548" y="76" width="118" height="60" rx="5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="607" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">#7FE081</text><text x="607" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">300</text><rect x="672" y="76" width="118" height="60" rx="5" fill="#49CB51"/><rect x="672" y="76" width="118" height="60" rx="5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="731" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">#49CB51</text><text x="731" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">400</text><rect x="796" y="76" width="118" height="60" rx="5" fill="#01BC2B"/><rect x="796" y="76" width="118" height="60" rx="5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="855" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">#01BC2B</text><text x="855" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">500</text><text x="22" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">anchor's chroma</text><text x="22" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">rejected</text><rect x="176" y="176" width="118" height="60" rx="5" fill="#8CFF91"/><rect x="176" y="176" width="118" height="60" rx="5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="235" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">#8CFF91</text><rect x="300" y="176" width="118" height="60" rx="5" fill="#7FFF85"/><rect x="300" y="176" width="118" height="60" rx="5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="359" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">#7FFF85</text><rect x="424" y="176" width="118" height="60" rx="5" fill="#6BFE73"/><rect x="424" y="176" width="118" height="60" rx="5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="483" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">#6BFE73</text><rect x="548" y="176" width="118" height="60" rx="5" fill="#53E95D"/><rect x="548" y="176" width="118" height="60" rx="5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="607" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">#53E95D</text><rect x="672" y="176" width="118" height="60" rx="5" fill="#2FCE41"/><rect x="672" y="176" width="118" height="60" rx="5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="731" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">#2FCE41</text><rect x="796" y="176" width="118" height="60" rx="5" fill="#01BC2B"/><rect x="796" y="176" width="118" height="60" rx="5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="855" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">#01BC2B</text><text x="22" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Both rows share the anchor and every step's lightness. Only chroma differs — and it is enough to turn every tint neon.</text>
</svg>
