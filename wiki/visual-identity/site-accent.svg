<svg xmlns="http://www.w3.org/2000/svg" width="792" height="352" viewBox="0 0 792 352" role="img" aria-labelledby="t d">
<title id="t">Site accent tokens and their per-host overrides</title><desc id="d">The four site accent steps shown twice: the root defaults in CORE green, and the theme-ubb override in Babes-Bolyai blue with step 900 outlined as the seal colour.</desc>
<rect width="792" height="352" fill="#ffffff"/>
<text x="22" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a">Site accent — one token set, rebound per host institution</text><text x="22" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">a host that wants no colour of its own simply does not override; the defaults are already on brand</text><text x="309" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">site-100</text><text x="439" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">site-200</text><text x="569" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">site-300</text><text x="699" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">site-900</text><text x="22" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">:root default — the CORE green</text><text x="22" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">what an unscoped text-site-* resolves to</text><rect x="250" y="88" width="118" height="54" rx="7" fill="#D6F7D5"/><rect x="250" y="88" width="118" height="54" rx="7" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="309" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b">#D6F7D5</text><rect x="380" y="88" width="118" height="54" rx="7" fill="#AFEDAF"/><rect x="380" y="88" width="118" height="54" rx="7" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="439" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b">#AFEDAF</text><rect x="510" y="88" width="118" height="54" rx="7" fill="#7FE081"/><rect x="510" y="88" width="118" height="54" rx="7" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="569" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b">#7FE081</text><rect x="640" y="88" width="118" height="54" rx="7" fill="#134E18"/><rect x="640" y="88" width="118" height="54" rx="7" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="699" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b">#134E18</text><text x="22" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">.theme-ubb — Babeș-Bolyai seal</text><text x="22" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">applied on /ubb</text><rect x="250" y="192" width="118" height="54" rx="7" fill="#E2F1FF"/><rect x="250" y="192" width="118" height="54" rx="7" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="309" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b">#E2F1FF</text><rect x="380" y="192" width="118" height="54" rx="7" fill="#C2E2FF"/><rect x="380" y="192" width="118" height="54" rx="7" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="439" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b">#C2E2FF</text><rect x="510" y="192" width="118" height="54" rx="7" fill="#91CDFF"/><rect x="510" y="192" width="118" height="54" rx="7" fill="none" stroke="#cbd5e1" stroke-width="0.5"/><text x="569" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b">#91CDFF</text><rect x="640" y="192" width="118" height="54" rx="7" fill="#034E84"/><rect x="640" y="192" width="118" height="54" rx="7" fill="none" stroke="#0f172a" stroke-width="2"/><text x="699" y="224" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">THE SEAL</text><text x="699" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#64748b">#034E84</text><line x1="22" y1="300" x2="770" y2="300" stroke="#cbd5e1" stroke-width="0.5"/><text x="22" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">Green owns action — buttons, links, active states, focus rings — on every lab page.</text><text x="22" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">The site accent owns place — kickers, rules, institutional marks, tints. Never anything clickable.</text>
</svg>
